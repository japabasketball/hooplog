<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<title>HoopLog</title>
<meta name="description" content="バスケのシュート確率を記録・分析するアプリ" />
<link rel="manifest" href="manifest.json" />
<meta name="theme-color" content="#1A1A2E" />
<link rel="apple-touch-icon" href="apple-touch-icon.png" />
<link rel="icon" type="image/png" href="icon-192.png" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="HoopLog" />
<style>
  * { -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; padding: 0; background: #1A1A2E; }
  body { font-family: 'Inter','Hiragino Sans',sans-serif; }
  input, textarea { font-family: inherit; }
  #pwa-banner { position: fixed; left: 50%; transform: translateX(-50%); bottom: 90px; z-index: 500; width: calc(100% - 32px); max-width: 420px; background: #2D2D44; border: 1px solid #3D3D5C; border-radius: 14px; padding: 12px 14px; display: none; align-items: center; gap: 12px; box-shadow: 0 8px 24px rgba(0,0,0,0.4); }
  #pwa-banner img { width: 40px; height: 40px; border-radius: 10px; flex-shrink: 0; }
  #pwa-banner .t { flex: 1; color: #E8E8E8; font-size: 13px; line-height: 1.5; }
  #pwa-banner .t b { color: #F4A200; }
  #pwa-banner button { border: none; border-radius: 8px; cursor: pointer; font-weight: 700; }
  #pwa-add { background: #F4A200; color: #1A1A2E; font-size: 13px; padding: 9px 14px; }
  #pwa-close { background: transparent; color: #777; font-size: 18px; padding: 2px 6px; }
  #splash { position: fixed; inset: 0; z-index: 9999; background: #1A1A2E; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 20px; transition: opacity 0.45s ease; }
  #splash.hide { opacity: 0; pointer-events: none; }
  #splash img { width: 108px; height: 108px; border-radius: 24px; box-shadow: 0 8px 30px rgba(0,0,0,0.5); }
  #splash .nm { font-size: 24px; font-weight: 800; color: #F4A200; letter-spacing: 1px; }
  #splash .by { font-size: 12px; color: #555; margin-top: -10px; }
  @keyframes splashpop { 0% { transform: scale(0.82); opacity: 0; } 60% { transform: scale(1.04); opacity: 1; } 100% { transform: scale(1); opacity: 1; } }
  #splash .pop { animation: splashpop 0.5s ease-out both; }
</style>
</head>
<body>
<div id="splash">
  <img class="pop" src="icon-192.png" alt="HoopLog" />
  <div class="nm pop">HoopLog</div>
  <div class="by">PlayLog</div>
</div>
<script>
  (function(){
    var s = document.getElementById("splash");
    if (!s) return;
    var standalone = window.matchMedia("(display-mode: standalone)").matches || window.navigator.standalone === true;
    if (standalone) { if (s.parentNode) s.parentNode.removeChild(s); return; }
    var MIN = 1300; var start = Date.now();
    function go(){
      var wait = Math.max(0, MIN - (Date.now() - start));
      setTimeout(function(){ s.classList.add("hide"); setTimeout(function(){ if(s&&s.parentNode) s.parentNode.removeChild(s); }, 500); }, wait);
    }
    if (document.readyState === "complete") go();
    else window.addEventListener("load", go);
  })();
</script>
<div id="root"></div>

<div id="pwa-banner">
  <img src="icon-192.png" alt="HoopLog" />
  <div class="t" id="pwa-text"><b>ホーム画面に追加</b><br>アプリみたいに一発で開けるよ</div>
  <button id="pwa-add">追加</button>
  <button id="pwa-close">&times;</button>
</div>

// ── PWA: service worker + install prompt ──
(function(){
  if ("serviceWorker" in navigator) {
    window.addEventListener("load", function(){ navigator.serviceWorker.register("sw.js?v=3").catch(function(){}); });
  }
  var banner = document.getElementById("pwa-banner");
  var addBtn = document.getElementById("pwa-add");
  var closeBtn = document.getElementById("pwa-close");
  var txt = document.getElementById("pwa-text");
  var deferredPrompt = null;
  var DISMISS_KEY = "hooplog-pwa-dismissed";
  function dismissed(){ try { return localStorage.getItem(DISMISS_KEY) === "1"; } catch(e){ return false; } }
  function hide(){ banner.style.display = "none"; }
  function closeForever(){ try { localStorage.setItem(DISMISS_KEY, "1"); } catch(e){} hide(); }
  closeBtn.addEventListener("click", closeForever);
  var standalone = window.matchMedia("(display-mode: standalone)").matches || window.navigator.standalone === true;
  var isIOS = /iphone|ipad|ipod/i.test(navigator.userAgent);
  window.addEventListener("beforeinstallprompt", function(e){
    e.preventDefault(); deferredPrompt = e;
    if (!standalone && !dismissed()) banner.style.display = "flex";
  });
  addBtn.addEventListener("click", function(){
    if (deferredPrompt) {
      deferredPrompt.prompt();
      deferredPrompt.userChoice.finally(function(){ deferredPrompt = null; closeForever(); });
    }
  });
  window.addEventListener("appinstalled", function(){ closeForever(); });
  if (isIOS && !standalone && !dismissed()) {
    txt.innerHTML = "<b>ホーム画面に追加</b><br>下の 共有 →「ホーム画面に追加」でアプリになるよ";
    addBtn.style.display = "none";
    setTimeout(function(){ banner.style.display = "flex"; }, 1500);
  }
})();
</script>
